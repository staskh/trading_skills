name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: uv.lock
          # Both matrix legs hash the same uv.lock, so without a per-version
          # suffix they share one cache entry and collide over wheels built for
          # different ABIs (cp312 vs cp313).
          cache-suffix: py${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --python is required on every uv invocation: .python-version pins 3.13,
      # and uv falls back to it otherwise, which would ignore the matrix.
      # --locked fails if uv.lock is stale rather than silently re-resolving.
      - name: Install dependencies
        run: uv sync --dev --locked --python ${{ matrix.python-version }}

      - name: Verify interpreter matches matrix
        run: |
          uv run --python ${{ matrix.python-version }} python -c "
          import sys
          want = '${{ matrix.python-version }}'
          got = f'{sys.version_info.major}.{sys.version_info.minor}'
          assert got == want, f'expected Python {want}, got {got}'
          print(f'Python {got} confirmed')
          "

      - name: Lint
        run: |
          uv run --python ${{ matrix.python-version }} ruff check src/ tests/ mcp_server/
          uv run --python ${{ matrix.python-version }} ruff format --check src/ tests/ mcp_server/

      - name: Run tests
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          uv run --python ${{ matrix.python-version }} pytest tests/ -v --tb=short \
            --cov=trading_skills --cov-report=term-missing \
            --cov-fail-under=65
